name: Spring Boot CI/CD to AWS EC2

on:
  push:
    branches: [ "main", "develop" ] # main: 운영 배포 / develop: 통합 검증

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # build.gradle.kts의 toolchain 설정과 일치
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트는 로컬에서 수행. Runner에서 Testcontainers가 Docker를 기동하면
      # 빌드 시간이 크게 늘어 CI 단계에서는 제외함
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Transfer Jar to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: "/home/ubuntu/planmanager"
          strip_components: 2

      - name: Execute Script on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/planmanager

            echo "포트 8080 프로세스 종료 시도"
            fuser -k -n tcp 8080 || true
            sleep 5

            # 부트 JAR만 대상으로 좁힘 (plain.jar 혼입 방지)
            JAR_NAME=$(ls -t *SNAPSHOT.jar | head -n 1)
            echo "새로운 애플리케이션 실행: $JAR_NAME"

            # 1GB 환경 OOM 방어: JVM Ergonomics 차단 후 힙 64MB 고정
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            nohup java -jar -Xmx64m -Xms64m plan-manager-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
            

            # 기동 확인 — 실패 시 파이프라인을 빨간색으로 떨어뜨림
            sleep 25
            if fuser -s -n tcp 8080; then
              echo "기동 확인 완료"
            else
              echo "기동 실패 — application.log 마지막 40줄"
              tail -n 40 application.log
              exit 1
            fi