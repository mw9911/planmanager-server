name: Spring Boot CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: build/libs/*-SNAPSHOT.jar

  deploy:
    needs: build # build 작업이 성공해야만 deploy 실행
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./deploy

      - name: SCP - Transfer JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "deploy/*.jar"
          target: "/home/ubuntu/planmanager"
          strip_components: 1

      - name: SSH - Execute Deployment Script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/planmanager
            
            # 1. 실행 중인 구버전 Spring Boot 프로세스 종료 (8080 포트)
            fuser -k -n tcp 8080 || true
            sleep 5
            
            # 2. 새 버전 백그라운드 무중단 실행 (로그는 app.log에 기록)
            nohup java -jar *.jar > app.log 2>&1 &