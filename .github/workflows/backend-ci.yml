name: Spring Boot CI/CD to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. JDK 환경 셋팅
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      # 3. Gradle 빌드 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 프로젝트 빌드 (프리티어 메모리 최적화를 위해 test 스킵)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5. EC2 서버로 빌드된 Jar 파일 전송
      - name: Transfer Jar to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: "/home/ubuntu/planmanager"
          strip_components: 2

      # 6. EC2 접속 후 애플리케이션 재시작
      - name: Execute Script on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/planmanager
            
            # 기존 프로세스 포착 및 안전 종료 (|| true 추가로 강제 에러 방지)
            PID=$(pgrep -f .jar)
            if [ -n "$PID" ]; then
              echo "기존 프로세스 종료: $PID"
              kill -15 $PID || true
              sleep 10
            fi
            
            # 최신 Jar 파일 포착
            JAR_NAME=$(ls -tr *.jar | tail -n 1)
            echo "새로운 애플리케이션 실행: $JAR_NAME"
            
            # SSH 세션과의 완벽한 분리를 위해 </dev/null 추가 (핵심 조치 ⭐)
            nohup java -jar $JAR_NAME> application.log 2>&1 </dev/null &