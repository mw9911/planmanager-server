spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://planmanager-db.c5ky8g0ccs0m.ap-northeast-2.rds.amazonaws.com:3306/planmanager?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: admin
    password: ${DB_PASSWORD} # 하드코딩 제거 및 환경변수 치환
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET} # 하드코딩 제거 및 환경변수 치환
  expiration: 1800000
  refresh-expiration: 1209600000
  #refresh-expiration: 1209600000000000000000
